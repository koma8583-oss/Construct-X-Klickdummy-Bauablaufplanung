name: Verify reconstructed Replit blobs

on:
  push:
    branches:
      - sync-84fc019
    paths:
      - .github/workflows/verify-sync-blobs.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-84fc019
      - name: Compare reconstructed blobs with ZIP commit
        shell: bash
        run: |
          set -euo pipefail
          mismatches=0
          while read -r expected path; do
            if [[ ! -f "$path" ]]; then
              echo "MISMATCH missing $path expected=$expected"
              mismatches=$((mismatches+1))
              continue
            fi
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "MISMATCH $path expected=$expected actual=$actual"
              mismatches=$((mismatches+1))
            fi
          done <<'EOF'
