kind = "web"
previewPath = "/"
title = "TaktKoord – Auftraggeber"
version = "1.0.0"
id = "artifacts/ag-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19652

[services.development]
run = "pnpm --filter @workspace/ag-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ag-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/ag-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19652"
BASE_PATH = "/"
