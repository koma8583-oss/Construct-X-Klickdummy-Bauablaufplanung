    # ── Webhook ──
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
        orgId:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
            enum:
              - delegation.created
              - delegation.confirmed
              - delegation.alternative_proposed
              - delegation.rejected
              - delegation.cancelled
              - response.accepted
              - response.rejected
        active:
          type: boolean
        secret:
          type: string
          nullable: true
          description: "HMAC signing secret for payload verification"
        createdAt:
          type: string
          format: date-time
      required: [id, orgId, url, events, active, createdAt]

    CreateWebhookRequest:
      type: object
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secret:
          type: string
      required: [url, events]

    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        secret:
          type: string

    WebhookEvent:
      type: object
      properties:
        id:
          type: string
        subscriptionId:
          type: string
        event:
          type: string
        payload:
          type: string
          description: "JSON-encoded webhook event payload"
        status:
          type: string
          enum: [PENDING, DELIVERED, FAILED]
        attempts:
          type: integer
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
