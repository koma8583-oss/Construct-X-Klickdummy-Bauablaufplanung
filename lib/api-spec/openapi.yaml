      tags: [leistungsanfragen]
      summary: Leistungsanfragen auflisten (Alias für GET /takt-requests)
      description: >
        GU sieht eigene Anfragen, NU sieht eingehende Anfragen.
        Kanonische Felder (leistungId, leistungsanfrageId) werden zusammen mit
        den Legacy-Feldern (taktId, id) zurückgegeben.
      parameters:
        - name: status
          in: query
