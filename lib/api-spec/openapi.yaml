    RevisionCreate:
      type: object
      description: >
        Request body for POST /takt-requests/{requestId}/revisions.
        Creates a new Takt version and a new TaktRequest for a revised
        coordination round after a REQUEST_REVISION decision.
      properties:
        plannedTimeWindow:
          type: object
          description: New planned time window for the Takt
          properties:
            start:
              type: string
              description: ISO date or datetime string (YYYY-MM-DD or ISO 8601)
            end:
              type: string
              description: ISO date or datetime string (YYYY-MM-DD or ISO 8601)
          required: [start, end]
        responseRequiredBy:
          type: string
          format: date-time
          nullable: true
          description: Deadline by which the NU must respond. Must be in the future.
        subject:
          type: string
          nullable: true
          maxLength: 500
          description: Human-readable subject for the coordination notification
        message:
          type: string
          nullable: true
          maxLength: 4000
          description: Free-text message from GU to NU
        sendImmediately:
          type: boolean
          default: false
          description: >
            If true, sends a TAKT_REQUEST_REVISED notification immediately
            after the transaction commits. New request transitions to DELIVERED.
            If the send fails, new request stays DRAFT.
        idempotencyKey:
          type: string
          nullable: true
          maxLength: 255
          description: Optional client-supplied idempotency key
        taktUpdates:
          type: object
          description: Optional Takt field updates to include in the new version
          properties:
            taktBezeichnung:   { type: string }
            zone:              { type: string }
            gewerk:            { type: string }
            description:       { type: string, nullable: true }
            earliestStart:     { type: string, nullable: true }
            latestEnd:         { type: string, nullable: true }
            lvReference:       { type: string, nullable: true }
            bimReference:      { type: string, nullable: true }
            requiredResources: { type: string, nullable: true }
      required:
        - plannedTimeWindow

    RevisionResponse:
      type: object
      description: >
        Result of a successful POST /takt-requests/{requestId}/revisions call.
        Describes the predecessor chain: old request → new request → new Takt version.
      properties:
        oldRequestId:
          type: string
          description: The original TaktRequest that was superseded
        oldRequestStatus:
          type: string
          enum: [SUPERSEDED]
        newRequestId:
          type: string
          description: The new TaktRequest (DRAFT or DELIVERED)
        newRequestNumber:
          type: string
          description: Human-readable reference for the new request
        newRequestStatus:
          type: string
          enum: [DRAFT, DELIVERED]
          description: DRAFT if sendImmediately=false, DELIVERED if send succeeded
        newTaktVersion:
          type: integer
          minimum: 2
          description: The new Takt version number (old version + 1)
        newTaktVersionId:
          type: string
          description: PK of the new takt_versions row
        snapshotId:
          type: string
          description: PK of the new TaktRequestSnapshot
        sent:
          type: boolean
          description: true if TAKT_REQUEST_REVISED was delivered to the NU
        createdAt:
          type: string
          format: date-time
      required:
        - oldRequestId
        - oldRequestStatus
        - newRequestId
        - newRequestNumber
        - newRequestStatus
        - newTaktVersion
        - newTaktVersionId
        - snapshotId
        - sent
        - createdAt

    TaktResponseAcceptedPayload:
      type: object
      description: >
        Payload of a TAKT_RESPONSE_ACCEPTED message sent from GU to NU after
        CONFIRM_ACCEPTED or ACCEPT_ALTERNATIVE decision.
        Contains only public coordination data — no internal GU notes,
        no full Takt, no NU resources, no internal conflicts or cost.
      properties:
        taktRequestId:
          type: string
        decisionType:
          type: string
          enum: [CONFIRM_ACCEPTED, ACCEPT_ALTERNATIVE]
        acceptedAlternativeId:
          type: string
          nullable: true
        confirmedTimeWindow:
          type: object
          nullable: true
          properties:
            start: { type: string }
            end:   { type: string }
          required: [start, end]
        taktVersion:
          type: integer
        comment:
          type: string
          nullable: true
      required:
        - taktRequestId
        - decisionType
        - taktVersion

    TaktResponseRevisionRequestedPayload:
      type: object
      description: >
        Payload of a TAKT_RESPONSE_REVISION_REQUESTED message sent from GU to
        NU after a REQUEST_REVISION decision.
      properties:
        taktRequestId:
          type: string
        decisionType:
          type: string
          enum: [REQUEST_REVISION]
        comment:
          type: string
          nullable: true
      required:
        - taktRequestId
        - decisionType

    TaktRequestRevisedPayload:
      type: object
      description: >
        Payload of a TAKT_REQUEST_REVISED message sent from GU to NU when a
        revised TaktRequest is dispatched (sendImmediately=true on /revisions).
        Contains standard TaktRequest notification fields plus predecessor chain.
        No full snapshot is included.
      properties:
        taktRequestId:
          type: string
          description: New (successor) TaktRequest ID
        supersedesRequestId:
          type: string
          description: The old TaktRequest that was superseded
        previousTaktVersion:
          type: integer
          description: Takt version before the revision
        taktVersion:
          type: integer
          description: New Takt version after the revision
        projectReference:
          type: string
        taktReference:
          type: string
        responseRequiredBy:
          type: string
          format: date-time
          nullable: true
        detailsRef:
          type: string
        subject:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
      required:
        - taktRequestId
        - supersedesRequestId
        - previousTaktVersion
        - taktVersion
        - taktReference

    TaktRequestCancelledPayload:
      type: object
      description: >
        Payload of a TAKT_REQUEST_CANCELLED message sent from GU to NU after a
        CLOSE_WITHOUT_AGREEMENT decision. Contains only minimal coordination
        data — no internal GU data, no full Takt, no NU resources.
      properties:
        taktRequestId:
          type: string
        comment:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
      required:
        - taktRequestId
        - closedAt

