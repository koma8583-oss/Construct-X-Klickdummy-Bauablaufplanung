openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TaktKoord API – Schedule coordination between clients (AG) and subcontractors (AN)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: organizations
    description: Organization management (AG and AN orgs)
  - name: projects
    description: AG project management
  - name: takte
    description: Taktplan entries (construction schedule cycles)
  - name: delegations
    description: Task delegations from AG to AN
  - name: delegation-responses
    description: AN responses to delegations
  - name: resources
    description: AN resource management (employees, equipment, machines)
  - name: resource-assignments
    description: AN Gantt resource assignments
  - name: webhooks
    description: Webhook subscriptions and event log
  - name: takt-dependencies
    description: Takt dependency (Anordnungsbeziehung) management
  - name: takt-requests
    description: TaktRequest — coordination requests from GU to NU (Task 2)
  - name: dashboard
    description: Dashboard summary endpoints
  - name: leistungen
    description: Kanonische Leistung-Endpunkte (Alias für /takte und /takt-dependencies)
  - name: leistungsanfragen
    description: Kanonische Leistungsanfrage-Endpunkte (Alias für /takt-requests)
  - name: dataspace-inbound
    description: Eingehende Dataspace-Nachrichten

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dataspace/inbound/service-requests:
    post:
      operationId: receiveInboundServiceRequest
      tags: [dataspace-inbound]
      summary: Receive an inbound service request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundServiceRequest"
      responses:
        "202":
          description: Accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundExchangeResult"
        "200":
          description: Duplicate delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundExchangeResult"
        "400":
          description: Invalid message

  /dataspace/inbound/service-responses:
    post:
      operationId: receiveInboundServiceResponse
      tags: [dataspace-inbound]
      summary: Receive an inbound service response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundServiceResponse"
      responses:
        "202":
          description: Accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundExchangeResult"
        "200":
          description: Duplicate delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundExchangeResult"
        "400":
          description: Invalid message

  # ──────────── Organizations ────────────
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations (optionally filter by type)
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [AG, AN]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create a new organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/me:
    get:
      operationId: getMyOrganizations
      tags: [organizations]
      summary: Get current user's organization memberships
      responses:
        "200":
          description: User's organizations with roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMembership"

  /organizations/{orgId}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization by ID
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{orgId}/members:
    get:
      operationId: listOrganizationMembers
      tags: [organizations]
      summary: List members of an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMember"
    post:
      operationId: addOrganizationMember
      tags: [organizations]
      summary: Add a member to an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"

  /organizations/{orgId}/members/{userId}:
    delete:
      operationId: removeOrganizationMember
      tags: [organizations]
      summary: Remove a member from an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed

  # ──────────── User Profile ────────────
  /users/me:
    get:
      operationId: getMyProfile
      tags: [organizations]
      summary: Get current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMyProfile
      tags: [organizations]
      summary: Update current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ──────────── Projects (AG) ────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects for the current AG organization
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, ARCHIVED]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project details
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/contractors:
    get:
      operationId: listProjectContractors
      tags: [projects]
      summary: List AN organizations assigned to this project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of contractor organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: addProjectContractor
      tags: [projects]
      summary: Add a subcontractor (AN org) to a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectContractorRequest"
      responses:
        "201":
          description: Contractor added

  /projects/{projectId}/contractors/{anOrgId}:
    delete:
      operationId: removeProjectContractor
      tags: [projects]
      summary: Remove a subcontractor from a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: anOrgId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  # ──────────── AG Project Overview (Task 9.2) ────────────
  /ag/projects/overview:
    get:
      operationId: getAgProjectsOverview
      tags: [ag-projects]
      summary: Summary KPIs for all projects of the authenticated AG
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of project summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgProjectSummary"
        "403":
          description: AG organisation required

  /ag/projects/{projectId}/overview:
    get:
      operationId: getAgProjectOverview
      tags: [ag-projects]
      summary: Detailed overview of a single project (AN assignments + coordination KPIs)
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgProjectDetailOverview"
        "403":
          description: AG organisation required
        "404":
          description: Project not found

  /ag/projects/{projectId}/subcontractors:
    get:
      operationId: listProjectSubcontractors
      tags: [ag-projects]
      summary: List all AN assignments for a project (all statuses)
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSubcontractorAssignment"
        "403":
          description: AG organisation required
        "404":
          description: Project not found
    post:
      operationId: createProjectSubcontractor
      tags: [ag-projects]
      summary: Assign an AN organisation to a project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectSubcontractorRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSubcontractorAssignment"
        "400":
          description: Validation error
        "403":
          description: AG organisation required
        "404":
          description: Project or AN not found
        "409":
          description: Assignment already exists for this project/AN/trade/workPackage combination

  /ag/projects/{projectId}/subcontractors/{assignmentId}:
    patch:
      operationId: updateProjectSubcontractor
      tags: [ag-projects]
      summary: Update an AN assignment (trade, status, validity period)
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProjectSubcontractorRequest"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSubcontractorAssignment"
        "400":
          description: Validation error or no fields to update
        "403":
          description: AG organisation required
        "404":
          description: Assignment not found

  /ag/projects/{projectId}/subcontractors/{assignmentId}/deactivate:
    post:
      operationId: deactivateProjectSubcontractor
      tags: [ag-projects]
      summary: Soft-deactivate an AN assignment (sets status to INACTIVE)
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assignment deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  assignmentId:
                    type: string
                  assignmentStatus:
                    type: string
        "403":
          description: AG organisation required
        "404":
          description: Assignment not found

  # ──────────── Takte ────────────
  /projects/{projectId}/takte:
    get:
      operationId: listTakte
      tags: [takte]
      summary: List all Takte (schedule entries) for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of Takte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Takt"
    post:
      operationId: createTakt
      tags: [takte]
      summary: Create a new Takt entry
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaktRequest"
      responses:
        "201":
          description: Created Takt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Takt"

  /projects/{projectId}/takte/{taktId}:
    get:
      operationId: getTakt
      tags: [takte]
      summary: Get a Takt entry
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taktId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Takt details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Takt"
    patch:
      operationId: updateTakt
      tags: [takte]
      summary: Update a Takt entry (incl. Gantt bar move/resize)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taktId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaktRequest"
      responses:
        "200":
          description: Updated Takt with cascade-reschedule result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaktUpdateResult"
    delete:
      operationId: deleteTakt
      tags: [takte]
      summary: Delete a Takt entry
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taktId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ──────────── Takt Dependencies ────────────
  /projects/{projectId}/takt-dependencies:
    get:
      operationId: listTaktDependencies
      tags: [takt-dependencies]
      summary: List all Takt dependencies for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of enriched TaktDependency objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaktDependency"
    post:
      operationId: createTaktDependency
      tags: [takt-dependencies]
      summary: Create a Takt dependency and cascade-reschedule successors
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaktDependencyRequest"
      responses:
        "201":
          description: Created dependency with reschedule result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaktDependencyCreateResult"

  /projects/{projectId}/takt-dependencies/{depId}:
    delete:
      operationId: deleteTaktDependency
      tags: [takt-dependencies]
      summary: Delete a Takt dependency and cascade-reschedule successors
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: depId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reschedule result after dependency removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaktDependencyDeleteResult"

  # ──────────── Delegations ────────────
  /delegations:
    get:
      operationId: listDelegations
      tags: [delegations]
      summary: List delegations (AG sees outgoing, AN sees incoming)
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, ALTERNATIVE_PROPOSED, REJECTED, CANCELLED]
        - name: anOrgId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of delegations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delegation"
    post:
      operationId: createDelegation
      tags: [delegations]
      summary: AG creates a delegation (assigns a Takt to an AN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDelegationRequest"
      responses:
        "201":
          description: Created delegation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"

  /delegations/{delegationId}:
    get:
      operationId: getDelegation
      tags: [delegations]
      summary: Get delegation details
      parameters:
        - name: delegationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delegation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
    patch:
      operationId: updateDelegation
      tags: [delegations]
      summary: AG updates or cancels a delegation
      parameters:
        - name: delegationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDelegationRequest"
      responses:
        "200":
          description: Updated delegation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
    delete:
      operationId: deleteDelegation
      tags: [delegations]
      summary: Cancel/delete a delegation
      parameters:
        - name: delegationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ──────────── Delegation Responses ────────────
  /delegations/{delegationId}/responses:
    get:
      operationId: listDelegationResponses
      tags: [delegation-responses]
      summary: Get all responses for a delegation
      parameters:
        - name: delegationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DelegationResponse"
    post:
      operationId: createDelegationResponse
      tags: [delegation-responses]
      summary: AN submits a response (confirm or propose alternative)
      parameters:
        - name: delegationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDelegationResponseRequest"
      responses:
        "201":
          description: Created response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationResponse"

  /delegations/{delegationId}/responses/{responseId}:
    patch:
      operationId: updateDelegationResponse
      tags: [delegation-responses]
      summary: AG accepts or rejects a delegation response
      parameters:
        - name: delegationId
          in: path
          required: true
          schema:
            type: string
        - name: responseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDelegationResponseDecisionRequest"
      responses:
        "200":
          description: Updated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationResponse"

  # ──────────── Resources (AN) ────────────
  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List resources for the current AN organization
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [EMPLOYEE, EQUIPMENT, MACHINE, OTHER]
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [resources]
      summary: Create a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /resources/{resourceId}:
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceRequest"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
    delete:
      operationId: deleteResource
      tags: [resources]
      summary: Delete a resource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

