  # ── NU-internal: local projects ─────────────────────────────────────────────

  /nu/local-projects:
    get:
      operationId: listNuLocalProjects
      summary: List NU's internal local projects
      description: >
        Returns all local projects owned by the authenticated NU organisation.
        GU and hub-admin users receive 403.
      tags: [NU Internal]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated list of local projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuLocalProjectListResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU or hub-admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createNuLocalProject
      summary: Create a NU internal local project
      description: >
        Creates an internal local project for the authenticated NU.
        nuOrgId is derived from the JWT — clients cannot supply it.
        Physical deletion is not supported; use status CANCELLED.
      tags: [NU Internal]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuLocalProjectCreate"
      responses:
        "201":
          description: Created local project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuLocalProject"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU or hub-admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: localProjectCode already exists for this organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /nu/local-projects/{projectId}:
    get:
      operationId: getNuLocalProject
      summary: Get a single NU local project
      tags: [NU Internal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuLocalProject"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU or hub-admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found (or belongs to a different NU)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateNuLocalProject
      summary: Update a NU local project
      description: >
        All fields are optional. To cancel a project set status to CANCELLED.
        Physical deletion is not supported.
      tags: [NU Internal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuLocalProjectUpdate"
      responses:
        "200":
          description: Updated local project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuLocalProject"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU or hub-admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── NU-internal: resource bookings ──────────────────────────────────────────

  /nu/resource-bookings:
    get:
      operationId: listNuResourceBookings
      summary: List NU resource bookings with optional overlap filter
      description: >
        Returns bookings owned by the authenticated NU organisation.
        Overlap filter: booking.startAt < endTo AND booking.endAt > startFrom.
        GU and hub-admin users receive 403.
      tags: [NU Internal]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: resourceId
          schema:
            type: string
        - in: query
          name: resourceTypeId
          schema:
            type: string
        - in: query
          name: localProjectId
          schema:
            type: string
        - in: query
          name: sourceType
          schema:
            type: string
            enum: [LOCAL_PROJECT, TAKT_REQUEST, MANUAL_BLOCK, ABSENCE, MAINTENANCE]
        - in: query
          name: status
          schema:
            type: string
            enum: [TENTATIVE, CONFIRMED, CANCELLED]
        - in: query
          name: startFrom
          description: >
            ISO 8601 datetime. Returns bookings where endAt > startFrom (overlap).
          schema:
            type: string
            format: date-time
        - in: query
          name: endTo
          description: >
            ISO 8601 datetime. Returns bookings where startAt < endTo (overlap).
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated list of resource bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuResourceBookingListResponse"
        "400":
          description: Invalid filter parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU or hub-admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createNuResourceBooking
      summary: Create a NU resource booking
      description: >
        Creates a booking for a resource belonging to the authenticated NU.
        nuOrgId is derived from the JWT — clients cannot supply it.
        The resource must belong to the caller's organisation.
        endAt must be after startAt.
        utilizationPercent must be 1–100.
      tags: [NU Internal]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuResourceBookingCreate"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuResourceBooking"
        "400":
          description: Validation error (endAt before startAt, invalid utilization, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU/hub-admin user, or resource belongs to a different organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /nu/resource-bookings/{bookingId}:
    get:
      operationId: getNuResourceBooking
      summary: Get a single NU resource booking
      tags: [NU Internal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuResourceBooking"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU or hub-admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found (or belongs to a different NU)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateNuResourceBooking
      summary: Update a NU resource booking
      description: >
        All fields are optional. Cannot update a CANCELLED booking (409).
        endAt must remain after startAt.
      tags: [NU Internal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuResourceBookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuResourceBooking"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU or hub-admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Cannot update a cancelled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteNuResourceBooking
      summary: Hard-delete a cancelled NU resource booking
      description: >
        Permanently removes a booking row. Only CANCELLED bookings may be deleted.
        Attempting to delete an active booking returns 409.
      tags: [NU Internal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Booking deleted
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU or hub-admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found (or belongs to a different NU)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Booking is not in CANCELLED status and cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /nu/resource-bookings/{bookingId}/cancel:
    post:
      operationId: cancelNuResourceBooking
      summary: Cancel a NU resource booking
      description: >
        Sets the booking status to CANCELLED. Idempotent — cancelling an
        already-cancelled booking returns 200. The booking row is preserved
        for historical audit purposes.
      tags: [NU Internal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled (or already-cancelled) booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuResourceBooking"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU or hub-admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found (or belongs to a different NU)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    InboundExchangeMetadata:
      type: object
      required: [messageId, correlationId, schemaVersion, senderOrgId, receiverOrgId, createdAt]
      properties:
        messageId: { type: string }
        correlationId: { type: string }
        schemaVersion: { type: string, enum: ["1.0"] }
        senderOrgId: { type: string }
        receiverOrgId: { type: string }
        createdAt: { type: string, format: date-time }

    InboundServiceRequest:
      type: object
      required: [metadata, requestId, requestVersion, projectReference, plannedStart, plannedEnd, resourceRequirements]
      properties:
        metadata: { $ref: "#/components/schemas/InboundExchangeMetadata" }
        requestId: { type: string }
        requestVersion: { type: integer }
        projectReference: { type: string }
        taktReference: { type: string }
        plannedStart: { type: string, format: date-time }
        plannedEnd: { type: string, format: date-time }
        resourceRequirements:
          type: array
          items: { type: object, additionalProperties: true }
        policy: { type: object, additionalProperties: true }

    InboundServiceResponse:
      type: object
      required: [metadata, requestId, requestVersion, decision]
      properties:
        metadata: { $ref: "#/components/schemas/InboundExchangeMetadata" }
        requestId: { type: string }
        requestVersion: { type: integer }
        decision: { type: string, enum: [ACCEPTED, REJECTED, ALTERNATIVES_PROPOSED] }
        alternatives:
          type: array
          items: { type: object, additionalProperties: true }

    InboundExchangeResult:
      type: object
      required: [messageId, status]
      properties:
        messageId: { type: string }
        status: { type: string, enum: [PROCESSED, DUPLICATE] }
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Organization ──
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        resourceTypeId:
          type: string
          nullable: true
        capacity:
          type: number
          nullable: true
        capacityUnit:
          type: string
          nullable: true
          enum: [PERSONS, UNITS, HOURS_PER_DAY, PERCENT]
        skills:
          type: array
          items: { type: string }
        qualifications:
          type: array
          items: { type: string }
        calendarId:
          type: string
          nullable: true
        active:
          type: boolean
        type:
          type: string
          enum: [AG, AN]
        description:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, type, createdAt]

    CreateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [AG, AN]
        description:
          type: string
        contactEmail:
          type: string
      required: [name, type]

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        contactEmail:
          type: string

    OrganizationMembership:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        role:
          type: string
          enum: [ADMIN, MEMBER]
        joinedAt:
          type: string
          format: date-time
      required: [organization, role, joinedAt]

    OrganizationMember:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER]
        joinedAt:
          type: string
          format: date-time
      required: [userId, name, email, role, joinedAt]

    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER]
      required: [email]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        preferredLanguage:
          type: string
          enum: [de, en]
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, createdAt]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        preferredLanguage:
          type: string
          enum: [de, en]

    # ── Project ──
    Project:
      type: object
      properties:
        id:
          type: string
        agOrgId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, ARCHIVED]
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        taktCount:
          type: integer
        delegationCount:
          type: integer
        pendingResponseCount:
          type: integer
      required: [id, agOrgId, name, status, createdAt, taktCount, delegationCount, pendingResponseCount]

    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required: [name]

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        location:
          type: string
        status:
          type: string
          enum: [ACTIVE, COMPLETED, ARCHIVED]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    # ── Takt ──
    TaktStatus:
      type: string
      enum: [GEPLANT, VERGEBEN, ALTERNATIV, BESTAETIGT, ABGELEHNT, STORNIERT]
      description: >
        Legacy Takt status (backward-compatible, retained for existing delegation routes).
        GEPLANT = angelegt, editierbar;
        VERGEBEN = Delegation verschickt;
        ALTERNATIV = AN hat Gegenvorschlag;
        BESTAETIGT = Termin bestätigt;
        ABGELEHNT = abgelehnt, wieder editierbar;
        STORNIERT = Vergabe storniert, wieder editierbar.

    TaktLifecycleStatus:
      type: string
      description: >
        Dedicated lifecycle status for the Takt itself (Task 2.2).
        Separated from TaktStatus to decouple the Takt lifecycle from
        the state of any individual TaktRequest.
        DRAFT = being edited; PLANNED = ready, no active coordination;
        IN_COORDINATION = at least one TaktRequest is active;
        CONFIRMED = a NU response was accepted by the GU;
        CANCELLED = Takt cancelled.
      enum: [DRAFT, PLANNED, IN_COORDINATION, CONFIRMED, CANCELLED]

    TaktRequestStatus:
      type: string
      description: >
        Status of one specific TaktRequest (coordination request from GU to NU).
        Transport states (DELIVERED) must not be confused with business decisions (ACCEPTED).
        Terminal states: ACCEPTED, CANCELLED, EXPIRED, SUPERSEDED.
      enum:
        - DRAFT
        - SENT
        - DELIVERED
        - DETAILS_RETRIEVED
        - UNDER_REVIEW
        - ACCEPTED
        - ALTERNATIVES_PROPOSED
        - REJECTED
        - REVISION_REQUIRED
        - CANCELLED
        - EXPIRED
        - SUPERSEDED

    Takt:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        taktBezeichnung:
          type: string
          description: "Takt-Bezeichnung (frei wählbar, z.B. T1 oder Rohbau-Nord)"
        zone:
          type: string
        gewerk:
          type: string
        description:
          type: string
          nullable: true
        plannedStart:
          type: string
          format: date
        plannedEnd:
          type: string
          format: date
        earliestStart:
          type: string
          format: date
          nullable: true
        latestEnd:
          type: string
          format: date
          nullable: true
        lvReference:
          type: string
          nullable: true
          description: "Placeholder for Leistungsverzeichnis reference"
        bimReference:
          type: string
          nullable: true
          description: "Placeholder for BIM model reference"
        requiredResources:
          type: string
          nullable: true
          description: "Free-text description of required resources"
        status:
          $ref: "#/components/schemas/TaktStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: "Last-modified timestamp"
        version:
          type: integer
          minimum: 1
          description: "Monotonically incrementing version; starts at 1 for all existing Takte"
        lifecycleStatus:
          $ref: "#/components/schemas/TaktLifecycleStatus"
      required: [id, projectId, taktBezeichnung, zone, gewerk, plannedStart, plannedEnd, status, createdAt]
      # version and lifecycleStatus are optional in responses for backward compatibility;
      # both fields are always populated in the database (have DEFAULT values).

    CreateTaktRequest:
      type: object
      properties:
        taktBezeichnung:
          type: string
        zone:
          type: string
        gewerk:
          type: string
        description:
          type: string
        plannedStart:
          type: string
          format: date
        plannedEnd:
          type: string
          format: date
        earliestStart:
          type: string
          format: date
        latestEnd:
          type: string
          format: date
        lvReference:
          type: string
        bimReference:
          type: string
        requiredResources:
          type: string
      required: [taktBezeichnung, zone, gewerk, plannedStart, plannedEnd]

    UpdateTaktRequest:
      type: object
      properties:
        taktBezeichnung:
          type: string
        zone:
          type: string
        gewerk:
          type: string
        description:
          type: string
        plannedStart:
          type: string
          format: date
        plannedEnd:
          type: string
          format: date
        earliestStart:
          type: string
          format: date
        latestEnd:
          type: string
          format: date
        lvReference:
          type: string
        bimReference:
          type: string
        requiredResources:
          type: string

    # ── Takt Dependencies ──
    TaktDependencyType:
      type: string
      description: "Anordnungsbeziehungs-Typ: EA=Ende-Anfang, AA=Anfang-Anfang, EE=Ende-Ende"
      enum: [EA, AA, EE]

    TaktDependency:
      type: object
      description: "A dependency between two Takte within the same project, enriched with predecessor and successor Takt objects"
      properties:
        id:
          type: string
        projectId:
          type: string
        predecessorId:
          type: string
        successorId:
          type: string
        type:
          $ref: "#/components/schemas/TaktDependencyType"
        lagDays:
          type: integer
          minimum: 0
          description: "Number of calendar days of lag between the trigger date and the constraint"
        predecessor:
          $ref: "#/components/schemas/Takt"
        successor:
          $ref: "#/components/schemas/Takt"
      required: [id, projectId, predecessorId, successorId, type, lagDays]

    CreateTaktDependencyRequest:
      type: object
      properties:
        predecessorId:
          type: string
        successorId:
          type: string
        type:
          $ref: "#/components/schemas/TaktDependencyType"
        lagDays:
          type: integer
          minimum: 0
      required: [predecessorId, successorId]

    TaktDependencyCreateResult:
      type: object
      description: "Result of creating a dependency including the new dependency and cascade-reschedule result"
      properties:
        dependency:
          $ref: "#/components/schemas/TaktDependency"
        moved:
          type: array
          items:
            $ref: "#/components/schemas/Takt"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/RescheduledTakt"
      required: [dependency, moved, conflicts]

    TaktDependencyDeleteResult:
      type: object
      description: "Result of deleting a dependency including the cascade-reschedule result"
      properties:
        moved:
          type: array
          items:
            $ref: "#/components/schemas/Takt"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/RescheduledTakt"
      required: [moved, conflicts]

    # ── Takt cascade-reschedule result (Task #17) ──
    RescheduledTakt:
      type: object
      description: "A Takt that could not be automatically moved due to its status, along with its required dates"
      properties:
        takt:
          $ref: "#/components/schemas/Takt"
        requiredStart:
          type: string
          format: date
          description: "The start date the dependency chain requires"
        requiredEnd:
          type: string
          format: date
          description: "The end date the dependency chain requires"
      required: [takt, requiredStart, requiredEnd]

    TaktUpdateResult:
      type: object
      description: "Result of a Takt update including cascade-rescheduled successors and scheduling conflicts"
      properties:
        takt:
          $ref: "#/components/schemas/Takt"
          description: "The updated Takt"
        moved:
          type: array
          items:
            $ref: "#/components/schemas/Takt"
          description: "Successor Takte that were automatically rescheduled"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/RescheduledTakt"
          description: "Successor Takte that could not be moved (e.g. already delegated)"
      required: [takt, moved, conflicts]

    # ── Delegation ──
    Delegation:
      type: object
      properties:
        id:
          type: string
        taktId:
          type: string
        projectId:
          type: string
        agOrgId:
          type: string
        anOrgId:
          type: string
        takt:
          $ref: "#/components/schemas/Takt"
        project:
          $ref: "#/components/schemas/Project"
        anOrganization:
          $ref: "#/components/schemas/Organization"
        agOrganization:
          $ref: "#/components/schemas/Organization"
        requestedStart:
          type: string
          format: date
        requestedEnd:
          type: string
          format: date
        earliestStart:
          type: string
          format: date
          nullable: true
        latestEnd:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [PENDING, CONFIRMED, ALTERNATIVE_PROPOSED, REJECTED, CANCELLED]
        message:
          type: string
          nullable: true
        isWithinBuffer:
          type: boolean
          nullable: true
          description: "True if the latest AN proposal is within the buffer window"
        createdAt:
          type: string
          format: date-time
        updatedAt:
