  # ──────────── NU Inbox (Sprint 3) ────────────

  /messages/inbox:
    get:
      operationId: listInboxMessages
      tags: [takt-requests]
      summary: NU lists their inbox messages (newest first)
      description: >
        Returns messages delivered to the authenticated NU organisation.
        recipientOrgId is always derived from the bearer token — clients cannot
        query another organisation's inbox. GU users and hub admins are rejected.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DataspaceMessageStatus"
        - name: messageType
          in: query
          schema:
            $ref: "#/components/schemas/DataspaceMessageType"
        - name: correlationId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
