        "400":
          description: Ungültiger Anfragekörper
        "401":
          description: Nicht authentifiziert
        "403":
          description: Zugriff verweigert
        "404":
          description: Leistung nicht gefunden
        "422":
          description: Leistung hat ungültiges Zeitfenster oder Version

