          in: query
          schema:
            type: string
          description: Filter nach Leistungs-ID (kanonisch; überschreibt taktId)
        - name: taktId
          in: query
          schema:
            type: string
          description: Filter nach Takt-ID (Legacy-Alias für leistungId)
