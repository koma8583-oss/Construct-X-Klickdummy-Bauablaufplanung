          description: List of inbox messages (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxMessageItem"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an AN organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /messages/inbox/{messageId}:
    get:
      operationId: getInboxMessage
      tags: [takt-requests]
      summary: NU retrieves a single inbox message by messageId
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inbox message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessageItem"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the addressed recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /messages/inbox/{messageId}/read:
    post:
      operationId: markInboxMessageRead
      tags: [takt-requests]
      summary: NU marks a message as READ
      description: >
        Sets the inbox status to READ and records readAt. Idempotent — calling
        this endpoint multiple times on the same message is safe. Does NOT
        change the TaktRequest status.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message marked as read (or was already read)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMarkReadResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the addressed recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ──────────── TaktRequest Sprint 3 endpoints ────────────

  /takt-requests:
    get:
      operationId: listTaktRequests
      tags: [takt-requests]
      summary: GU lists their own TaktRequests (enriched with Takt, project, NU, transport status)
      description: >
        Returns all TaktRequests for the authenticated GU organisation, joined
        with Takt name, project name, NU organisation name, and the transport
        delivery status of the notification message.

        Access: GU users only. NU users pass role=nu instead; hub admins → 403.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaktRequestStatus"
          description: Filter by request status
        - name: taktId
          in: query
          schema:
            type: string
          description: Filter by Takt ID
        - name: nuOrgId
          in: query
          schema:
            type: string
          description: Filter by NU organisation ID
      responses:
        "200":
          description: List of enriched TaktRequests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaktRequestListItem"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Hub admin or unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createTaktRequestWithSnapshot
      tags: [takt-requests]
      summary: GU creates a TaktRequest draft with an immutable Takt snapshot
      description: >
        Creates a TaktRequest in DRAFT status and atomically persists an
        immutable whitelist-scoped snapshot of the current Takt. No message is
        sent; call /takt-requests/{requestId}/send to deliver the notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaktRequestBody"
      responses:
        "201":
          description: TaktRequest created in DRAFT status with snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaktRequestDraftResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: GU org is not the project owner, or NU is not a registered contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Takt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Takt has invalid time window or version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /takt-requests/{requestId}:
    get:
      operationId: getTaktRequestDetail
      tags: [takt-requests]
      summary: GU detail view — full metadata, timeline, snapshot, notification, and response
      description: >
        Returns the complete detail record for a single TaktRequest.
        Includes: enriched metadata (Takt name, project name, NU org name),
        all process timestamps for the timeline, transport/outbox information
        (status, failure reason, attempt count), the immutable snapshot, the
        notification payload actually sent to the NU, and the NU's response
        with any proposed alternatives.

        Access: the creating GU organisation only. Other GU, NU, hub admins
        and unauthenticated callers receive 403 or 404.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full detail record for the TaktRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaktRequestDetail"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Hub admin attempting access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TaktRequest not found, or belongs to a different GU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /takt-requests/{requestId}/gu-decisions:
    post:
      operationId: createGuDecision
      tags: [takt-requests]
      summary: GU creates a business decision on a TaktResponse
      description: >
        Allows the creating GU organisation to record a formal decision on the
        NU's TaktResponse. The decision type must match the NU response decision:


        | NU response  | Allowed GU decision types |
        |---|---|
        | ACCEPTED | CONFIRM_ACCEPTED, REQUEST_REVISION, CLOSE_WITHOUT_AGREEMENT |
        | ALTERNATIVES_PROPOSED | ACCEPT_ALTERNATIVE, REQUEST_REVISION, CLOSE_WITHOUT_AGREEMENT |
        | REJECTED | REQUEST_REVISION, CLOSE_WITHOUT_AGREEMENT |


        Idempotency: Supply an optional `Idempotency-Key` header or include
        `idempotencyKey` in the body. Identical key + identical content returns
        200 with the existing decision. Identical key + different content returns
        409.


        A second decision for the same response always returns 409 regardless of
        idempotency key.


        Transactions: decision insert and TaktRequest status update are atomic.


        Permissions: GU (AG) organisation that created the TaktRequest only.
        NU organisations and hub admins receive 403.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional client-supplied idempotency key. Same key + same body returns
            the existing decision (HTTP 200). Same key + different body returns 409.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuDecisionCreate"
      responses:
        "201":
          description: GU decision created and TaktRequest status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuDecisionResponse"
        "200":
          description: Idempotent retry — existing decision returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuDecisionResponse"
        "400":
          description: >
            Invalid request — decision type not allowed for this NU response,
            missing acceptedAlternativeId for ACCEPT_ALTERNATIVE, or
            acceptedAlternativeId set for non-ACCEPT_ALTERNATIVE decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the creating GU organisation, is a NU, or is a hub admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TaktRequest not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            A decision already exists for this response, or the idempotency key
            was already used with different content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /takt-requests/{requestId}/revisions:
    post:
      operationId: createRevision
      tags: [takt-requests]
      summary: Start a new coordination round after a REQUEST_REVISION decision
      description: >
        Creates a new Takt version (REVISION), a new TaktRequest (DRAFT), and an
        immutable snapshot. The old request is set to SUPERSEDED. All steps are
        atomic. Optionally sends a TAKT_REQUEST_REVISED notification immediately.

        Preconditions:
          - Old request must have status REVISION_REQUIRED
          - Caller must be the GU organisation that created the old request
          - A REQUEST_REVISION GU decision must exist
          - No successor request may already exist

        Idempotency:
          - supersedesRequestId is unique — a duplicate call returns 409
          - If sendImmediately fails the version/request/snapshot are preserved;
            retry will send the same new request

        Predecessor chain:
          Request 1 → Response 1 → GU decision REQUEST_REVISION →
          Takt version N+1 → Request 2 (new)
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionCreate"
      responses:
        "201":
          description: New revision round created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionResponse"
        "400":
          description: >
            Invalid request — bad time window, responseRequiredBy in the past,
            old request has no response, or missing REQUEST_REVISION decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the GU organisation that created the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TaktRequest or Takt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Old request is not in REVISION_REQUIRED status, a successor already
            exists, or a concurrent version conflict was detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /takt-requests/{requestId}/details:
    get:
      operationId: getTaktRequestDetails
      tags: [takt-requests]
      summary: Pull the immutable Takt snapshot released for a TaktRequest
      description: >
        Returns the immutable point-in-time Takt snapshot that was created when
        the request was sent. The response NEVER contains the live Takt row —
        only the snapshot data released by the GU.

        Access:
          - The addressed NU organisation: may access when status is DELIVERED,
            DETAILS_RETRIEVED, or UNDER_REVIEW. First access transitions
            DELIVERED → DETAILS_RETRIEVED and records detailsRetrievedAt.
            Subsequent access (DETAILS_RETRIEVED, UNDER_REVIEW) is idempotent.
          - The creating GU organisation: always has read access for
            control/preview purposes. Does NOT trigger any status transition.

        Forbidden for all other callers (other NU, other GU, hub admins,
        unauthenticated users).
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Immutable Takt snapshot for this TaktRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaktRequestDetailsResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the addressed NU or the creating GU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TaktRequest not found, or snapshot not yet available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request is in a state that does not permit details retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /takt-requests/{requestId}/send:
    post:
      operationId: sendTaktRequest
      tags: [takt-requests]
      summary: GU sends a DRAFT TaktRequest as a notification to the NU
      description: >
        Builds a TaktRequestNotificationPayload (no full Takt data), delivers
        it via MessageTransport, and transitions the request
        DRAFT → SENT → DELIVERED. Also sets the Takt lifecycle status to
        IN_COORDINATION. Idempotent: if already DELIVERED, returns the existing
        result without creating a second message.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: TaktRequest sent and locally delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaktRequestSendResult"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the GU organisation that owns this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TaktRequest not found, or snapshot missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid status transition (already cancelled, superseded, or rejected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Transport delivery failed — request left in SENT status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── NU: availability checks (Task 4.7) ──────────────────────────────────────

  /takt-requests/{requestId}/availability-checks:
    post:
      operationId: runAvailabilityCheck
      tags: [takt-requests]
      summary: NU runs a feasibility check against their own resource calendar
      description: >
        The addressed NU organisation triggers an availability check for the given
        TaktRequest. The service inspects the NU's resources and existing bookings
        against the planned time window from the snapshot.

        On success the TaktRequest transitions to UNDER_REVIEW (if it was
        DETAILS_RETRIEVED). Repeated calls are allowed (UNDER_REVIEW stays).

        Access: addressed NU only. GU, hub-admin → 403.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Availability check completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityCheckResponse"
        "400":
          description: Check cannot be run (e.g. snapshot missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the addressed NU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TaktRequest not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request is not in a state that allows a check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /takt-requests/{requestId}/availability-checks/latest:
    get:
      operationId: getLatestAvailabilityCheck
      tags: [takt-requests]
      summary: NU retrieves the latest feasibility check result
      description: >
        Returns the most recently completed availability check for the given
        TaktRequest. Prefers COMPLETED checks; falls back to any latest check.

        Access: addressed NU only. GU, hub-admin → 403.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest availability check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityCheckResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the addressed NU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TaktRequest not found, or no check exists yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /takt-requests/{requestId}/responses:
    post:
      operationId: submitNuResponse
      tags: [takt-requests]
      summary: NU submits a business response (ACCEPTED / ALTERNATIVES_PROPOSED / REJECTED)
      description: >
        The addressed NU organisation submits their coordination response for the
        TaktRequest. Allowed starting statuses: DETAILS_RETRIEVED, UNDER_REVIEW.

        Privacy rules (enforced server-side):
          - Forbidden fields: resourceId, localProjectId, internalResultPayload,
            localProjectCode, customerAlias, resourceName, employeeId, etc.
          - Only generic reason codes and time windows may be transmitted.

        Idempotency: repeated calls with the same decision return 200 (no second
        row created). A different decision returns 409.

        On success, a TAKT_RESPONSE_SUBMITTED message is delivered to the GU's
        inbox. The message payload contains only public data.

        Access: addressed NU only. GU, hub-admin → 403.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuResponseCreate"
      responses:
        "201":
          description: Response created and message delivered to GU inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuResponseResult"
        "200":
          description: Identical response already exists (idempotent retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NuResponseResult"
        "400":
          description: Forbidden field in body or validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the addressed NU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TaktRequest not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Different decision already submitted, or request status not answerable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ──────────── Canonical German Leistung endpoints (Task #196) ────────────
  # These paths expose the same business logic as the corresponding /takte,
  # /takt-dependencies and /takt-requests routes under canonical German URIs.
  # Responses include both legacy (taktBezeichnung / taktId / taktVersion /
  # taktRequestId) and canonical (leistungBezeichnung / leistungId /
  # leistungVersion / leistungsanfrageId) field names.
  # Request bodies accept both forms; canonical takes precedence.

  /projects/{projectId}/leistungen:
    get:
      operationId: listLeistungen
      tags: [leistungen]
      summary: Leistungen eines Projekts auflisten (Alias für /takte)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste der Leistungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leistung"
        "403":
          description: Nur AG-Organisationen dürfen auf Leistungsdaten zugreifen
        "404":
          description: Projekt nicht gefunden
    post:
      operationId: createLeistung
      tags: [leistungen]
      summary: Neue Leistung anlegen (Alias für POST /takte)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeistungRequest"
      responses:
        "201":
          description: Leistung erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leistung"
        "400":
          description: Validierungsfehler
        "403":
          description: Nur AG-Organisationen dürfen Leistungen anlegen
        "404":
          description: Projekt nicht gefunden

  /projects/{projectId}/leistungen/{leistungId}:
    get:
      operationId: getLeistung
      tags: [leistungen]
      summary: Einzelne Leistung abrufen (Alias für GET /takte/:taktId)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: leistungId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Leistungsdetails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leistung"
        "403":
          description: Zugriff verweigert
        "404":
          description: Leistung nicht gefunden
    patch:
      operationId: updateLeistung
      tags: [leistungen]
      summary: Leistung aktualisieren (Alias für PATCH /takte/:taktId)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: leistungId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeistungRequest"
      responses:
        "200":
          description: Aktualisierte Leistung mit Verschiebungsergebnis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeistungUpdateResult"
        "400":
          description: Validierungsfehler
        "403":
          description: Zugriff verweigert
        "404":
          description: Leistung nicht gefunden
        "409":
          description: Status lässt keine Bearbeitung zu
    delete:
      operationId: deleteLeistung
      tags: [leistungen]
      summary: Leistung löschen (Alias für DELETE /takte/:taktId)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: leistungId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Gelöscht
        "403":
          description: Zugriff verweigert
        "404":
          description: Leistung nicht gefunden
        "409":
          description: Status lässt keine Löschung zu

