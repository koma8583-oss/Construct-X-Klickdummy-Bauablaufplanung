    # ── Dataspace message envelope (Tasks 1.4 + 1.5) ──

    DataspaceMessageType:
      type: string
      description: >
        Typed message kinds for the federated Takt coordination dataspace.
        These values identify the business event carried in a MessageEnvelope.
      enum:
        - TAKT_REQUEST_NOTIFICATION
        - TAKT_REQUEST_REVISED
        - TAKT_REQUEST_CANCELLED
        - TAKT_DETAILS_RETRIEVED
        - TAKT_RESPONSE_SUBMITTED
        - TAKT_RESPONSE_ACCEPTED
        - TAKT_RESPONSE_REVISION_REQUESTED
        - TAKT_REQUEST_EXPIRED
        - TAKT_REQUEST_REMINDER
        - DATA_OFFER_PUBLISHED

    DataspaceMessageStatus:
      type: string
      description: >
        Technical delivery status of a message envelope.
        DELIVERED means the message arrived — it is NOT a business confirmation.
        Business outcomes are expressed in TaktDecision, not here.
      enum:
        - PENDING
        - SENT
        - DELIVERED
        - READ
        - FAILED

    MessageEnvelope:
      type: object
      description: >
        Generic transport envelope for all dataspace messages.
        correlationId ties all messages of one TaktRequest process together.
        causationId references the messageId of the triggering message (null on first message).
        schemaVersion is carried from the start to enable future schema evolution.
      properties:
        messageId:
          type: string
          minLength: 1
          description: "Unique identifier for this individual message"
        schemaVersion:
          type: string
          pattern: '^\d+\.\d+$'
          description: "Schema version in major.minor format, e.g. '1.0'"
        messageType:
          $ref: "#/components/schemas/DataspaceMessageType"
        senderOrgId:
          type: string
          description: "Organisation ID of the sender"
        recipientOrgId:
          type: string
          description: "Organisation ID of the intended recipient"
        correlationId:
          type: string
          description: "Links all messages belonging to one TaktRequest process"
        createdAt:
          type: string
          format: date-time
          description: "ISO 8601 UTC creation timestamp"
        payload:
          type: object
          additionalProperties: true
          description: "Typed payload — schema depends on messageType"
        causationId:
          type: string
          nullable: true
          description: "messageId of the message that caused this one; null on initial notification"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: "ISO 8601 UTC expiry of the business validity window"
        status:
          $ref: "#/components/schemas/DataspaceMessageStatus"
      required:
        - messageId
        - schemaVersion
        - messageType
        - senderOrgId
        - recipientOrgId
        - correlationId
        - createdAt
        - payload

    # ── Takt request payload (Task 1.5) ──

    # ── Sprint 3 details schema ──

    TaktRequestDetailsResponse:
      type: object
      description: >
        Immutable snapshot payload returned by GET /takt-requests/{requestId}/details.
        Contains only the data the GU released at the time of sending — never the
        live Takt row or any NU-private data.
      properties:
        taktRequestId:
          type: string
          description: ID of the TaktRequest this snapshot belongs to
        requestNumber:
          type: string
          description: Human-readable request reference (e.g. TKR-2026-0042)
        schemaVersion:
          type: string
          description: Snapshot payload schema version (e.g. "1.0")
        taktVersion:
          type: integer
          description: Takt version at the time the snapshot was created
        status:
          type: string
          description: Current TaktRequest status
        guOrgId:
          type: string
          description: GU organisation that created this request
        nuOrgId:
          type: string
          description: NU organisation addressed by this request
        responseRequiredBy:
          type: string
          format: date-time
          nullable: true
          description: Deadline by which the NU must respond
        detailsRetrievedAt:
          type: string
          format: date-time
          nullable: true
          description: When the NU first retrieved these details; null until first access
        snapshotPayload:
          type: object
          description: >
            The released Takt data. Shape defined in docs/json-contracts.md.
            Does NOT contain full project plan, current live Takt values,
            other NU data, or internal GU data.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: When the snapshot was created (same as request send time)
      required:
        - taktRequestId
        - requestNumber
        - schemaVersion
        - taktVersion
        - status
        - guOrgId
        - nuOrgId
        - snapshotPayload
        - createdAt

    # ── Sprint 3 inbox schemas ──

    InboxMessageItem:
      type: object
      description: >
        A single message in the NU inbox. Contains only the notification metadata
        and the minimal payload as delivered — no full Takt snapshot is included.
      properties:
        id:
          type: string
          description: Inbox row ID (unique per message+recipient pair)
        messageId:
          type: string
          description: Globally unique message identifier
        messageType:
          $ref: "#/components/schemas/DataspaceMessageType"
        senderOrgId:
          type: string
          description: Organisation that sent the message
        recipientOrgId:
          type: string
          description: Organisation that received the message
        correlationId:
          type: string
          description: Ties this message to a TaktRequest coordination thread
        status:
          $ref: "#/components/schemas/DataspaceMessageStatus"
        payload:
          type: object
          description: >
            Typed payload. For TAKT_REQUEST_NOTIFICATION: contains taktRequestId,
            projectReference, taktReference, taktVersion, responseRequiredBy,
            detailsRef, subject, message. No full Takt data.
          additionalProperties: true
        receivedAt:
          type: string
          format: date-time
          description: When the message was delivered to this inbox
        readAt:
          type: string
          format: date-time
          nullable: true
          description: When the recipient marked the message as read; null if unread
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - messageId
        - messageType
        - senderOrgId
        - recipientOrgId
        - correlationId
        - status
        - payload
        - receivedAt
        - createdAt

    InboxMarkReadResponse:
      type: object
      description: Response from POST /messages/inbox/{messageId}/read.
      properties:
        messageId:
          type: string
        status:
          $ref: "#/components/schemas/DataspaceMessageStatus"
        readAt:
          type: string
          format: date-time
          nullable: true
      required:
        - messageId
        - status

    # ── Sprint 3 request/response schemas ──

    CreateTaktRequestBody:
      type: object
      description: Body for POST /takt-requests — GU creates a TaktRequest draft with snapshot.
      properties:
        taktId:
          type: string
          minLength: 1
          description: ID of the Takt to coordinate
        nuOrgId:
          type: string
          minLength: 1
          description: ID of the NU organisation to address
        responseRequiredBy:
          type: string
          format: date-time
          description: ISO 8601 deadline by which the NU must respond
          nullable: true
        subject:
          type: string
          maxLength: 255
          description: Optional human-readable subject line for the coordination message
        message:
          type: string
          maxLength: 2000
          description: Optional free-text message from GU to NU
      required:
        - taktId
        - nuOrgId

    TaktRequestDraftResponse:
      type: object
      description: Response from POST /takt-requests — the newly created DRAFT request.
      properties:
        id:
          type: string
          description: TaktRequest ID
        taktId:
          type: string
        taktVersion:
          type: integer
          minimum: 1
          description: Takt version at the time of request creation
        guOrgId:
          type: string
        nuOrgId:
          type: string
        requestNumber:
          type: string
        status:
          $ref: "#/components/schemas/TaktRequestStatus"
        responseRequiredBy:
          type: string
          format: date-time
          nullable: true
        snapshotId:
          type: string
          description: ID of the immutable snapshot created atomically with this request
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - taktId
        - taktVersion
        - guOrgId
        - nuOrgId
        - requestNumber
        - status
        - snapshotId
        - createdAt

    TaktRequestSendResult:
      type: object
      description: Response from POST /takt-requests/{requestId}/send.
      properties:
        requestId:
          type: string
        status:
          $ref: "#/components/schemas/TaktRequestStatus"
        sentAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        messageId:
          type: string
          description: Outbox message ID — deterministic; use for traceability and retry
        taktLifecycleStatus:
          type: string
          description: Updated Takt lifecycle status after delivery (IN_COORDINATION on success)
      required:
        - requestId
        - status
        - messageId

    TaktRequestNotificationPayload:
      type: object
      description: >
        Payload for a TAKT_REQUEST_NOTIFICATION message.
        Contains only references and metadata — no full Takt details.
        The NU uses detailsRef to pull the released Takt data separately (pull pattern).
        Must NOT contain: full Takt schedule, other NU data, full LV data,
        full BIM model, internal GU comments, or NU resource data.
      properties:
        taktRequestId:
          type: string
          description: "Unique identifier of the TaktRequest (matches correlationId)"
        projectReference:
          type: string
          description: "Opaque project reference — no internal GU project details"
        taktReference:
          type: string
          description: "Opaque Takt reference — no full schedule context"
        taktVersion:
          type: integer
          minimum: 1
          description: "Monotonically increasing version of the Takt snapshot"
        responseRequiredBy:
          type: string
          format: date-time
          description: "ISO 8601 UTC deadline by which the NU must respond"
        detailsRef:
          type: string
          description: "URL or reference for the NU to pull the released Takt details"
        subject:
          type: string
          description: "Optional human-readable subject line"
        message:
          type: string
          description: "Optional free-text message from the GU to the NU"
      required:
        - taktRequestId
        - projectReference
        - taktReference
        - taktVersion
        - responseRequiredBy
        - detailsRef

    TaktDecision:
      type: string
      description: "Business decision made by the NU in response to a TaktRequest"
      enum:
        - ACCEPTED
        - ALTERNATIVES_PROPOSED
        - REJECTED

    # ── Sprint 5 schemas (Task 5.2) ─────────────────────────────────────────────

    MessageOutboxStatus:
      type: string
      description: "Technical delivery status of a dataspace message"
      enum:
        - PENDING
        - SENT
        - DELIVERED
        - READ
        - FAILED

    TaktRequestListItem:
      type: object
      description: >
        Enriched TaktRequest row for the GU overview list.
        Includes Takt name, project name, NU org name, and transport status.
        Never contains internal NU data.
      properties:
        id:
          type: string
        requestNumber:
          type: string
          description: "Human-readable unique reference (e.g. TKR-2026-0042)"
        taktId:
          type: string
        taktBezeichnung:
          type: string
          description: "Display name of the Takt"
        taktVersion:
          type: integer
          minimum: 1
        projectId:
          type: string
        projectName:
          type: string
        guOrgId:
          type: string
        nuOrgId:
          type: string
        nuOrgName:
          type: string
          description: "Display name of the addressed NU organisation"
        status:
          $ref: "#/components/schemas/TaktRequestStatus"
        outboxStatus:
          nullable: true
          description: "Transport delivery status of the notification message. Null if not yet sent."
          allOf:
            - $ref: "#/components/schemas/MessageOutboxStatus"
        responseRequiredBy:
          type: string
          format: date-time
          nullable: true
          description: "Deadline by which the NU must respond"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: "Hard expiry — request auto-expires at this time if NU has not responded"
        expiredAt:
          type: string
          format: date-time
          nullable: true
          description: "Set when the request was actually expired"
        guDecisionRequiredBy:
          type: string
          format: date-time
          nullable: true
          description: "Deadline by which the GU must decide on the NU response"
        lastReminderAt:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp of the last dispatched reminder"
        reminderCount:
          type: integer
          minimum: 0
          description: "Total number of reminders dispatched"
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentAgreement:
          type: object
          nullable: true
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
          required: [start, end]
        openProposal:
          type: object
          nullable: true
          properties:
            id:
              type: string
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
            proposerOrgId:
              type: string
            status:
              type: string
            reasonCode:
              type: string
              nullable: true
            comment:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
          required: [id, start, end, proposerOrgId, status, createdAt]
        coordinationState:
          type: string
          enum: [AGREED, AG_ACTION_REQUIRED, AN_ACTION_REQUIRED, NO_AGREEMENT]
        nextActionOwner:
          type: string
          enum: [AG, AN]
          nullable: true
        scheduleDelta:
          type: object
          properties:
            startDays:
              type: integer
            endDays:
              type: integer
            durationDays:
              type: integer
            hasChange:
              type: boolean
          required: [startDays, endDays, durationDays, hasChange]
      required:
        - id
        - requestNumber
        - taktId
        - taktBezeichnung
        - taktVersion
        - projectId
        - projectName
        - guOrgId
        - nuOrgId
        - nuOrgName
        - status
        - reminderCount
        - createdAt
        - updatedAt
        - coordinationState
        - scheduleDelta

    # ── Sprint 5 Task 5.4 schemas ────────────────────────────────────────────────

    TaktRequestDetailTransport:
      type: object
      description: Transport/outbox information for the notification sent to the NU
      properties:
        status:
          nullable: true
          description: "Outbox delivery status; null if not yet queued"
          allOf:
            - $ref: "#/components/schemas/MessageOutboxStatus"
        notificationPayload:
          type: object
          nullable: true
          additionalProperties: true
          description: "Payload that was actually delivered to the NU"
        attemptCount:
          type: integer
          nullable: true
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        failureReason:
          type: string
          nullable: true
        inboxReadAt:
          type: string
          format: date-time
          nullable: true
          description: "When the NU's inbox row was marked as read"

    TaktRequestDetailTimeline:
      type: object
      description: All process timestamps in one flat object. Null = not yet occurred or not tracked.
      properties:
        requestCreatedAt:
          type: string
          format: date-time
        snapshotCreatedAt:
          type: string
          format: date-time
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        inboxReadAt:
          type: string
          format: date-time
          nullable: true
        detailsRetrievedAt:
          type: string
          format: date-time
          nullable: true
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: "Not tracked from the GU side — always null"
        responseCreatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - requestCreatedAt

    TaktRequestDetailResponseAlt:
      type: object
      properties:
        id:
          type: string
          description: Row UUID of the takt_response_alternatives row. Use this value as acceptedAlternativeId when submitting an ACCEPT_ALTERNATIVE GU decision.
        alternativeId:
          type: string
          description: NU-assigned business identifier (e.g. "ALT-001"). For display only — do not submit this as acceptedAlternativeId.
        rank:
          type: integer
        proposedStart:
          type: string
          format: date-time
        proposedEnd:
          type: string
          format: date-time
        crewSize:
          type: integer
          nullable: true
        conditions:
          type: array
          nullable: true
          items:
            type: string
      required:
        - id
        - alternativeId
        - rank
        - proposedStart
        - proposedEnd

    TaktRequestDetailResponse:
      type: object
      properties:
        id:
          type: string
        decision:
          type: string
          enum: [ACCEPTED, ALTERNATIVES_PROPOSED, REJECTED]
        reasonCode:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        acceptedStart:
          type: string
          format: date-time
          nullable: true
        acceptedEnd:
          type: string
          format: date-time
          nullable: true
        nextAvailableDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/TaktRequestDetailResponseAlt"
      required:
        - id
        - decision
        - createdAt
        - alternatives

    GuDecisionCreate:
      type: object
      description: >
        Request body for POST /takt-requests/{requestId}/gu-decisions.
        The decisionType must be valid for the current NU response decision.
      properties:
        decisionType:
          type: string
          enum:
            - CONFIRM_ACCEPTED
            - ACCEPT_ALTERNATIVE
            - REQUEST_REVISION
            - CLOSE_WITHOUT_AGREEMENT
          description: >
            CONFIRM_ACCEPTED: confirm the NU's accepted time window.
            ACCEPT_ALTERNATIVE: select one of the NU's proposed alternatives.
            REQUEST_REVISION: request a revised coordination round.
            CLOSE_WITHOUT_AGREEMENT: close this round without agreement.
        acceptedAlternativeId:
          type: string
          minLength: 1
          description: >
            Required and only valid for ACCEPT_ALTERNATIVE.
            Must be the DB id of an alternative belonging to the NU response
            for this TaktRequest.
        comment:
          type: string
          maxLength: 2000
          description: Optional free-text comment from the GU planner.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Optional client-supplied idempotency key. Alternatively supply the
            Idempotency-Key HTTP header. Body field takes precedence.
      required:
        - decisionType

    GuDecisionResponse:
      type: object
      description: Created or existing GU decision with updated TaktRequest status.
      properties:
        decisionId:
          type: string
          description: Primary key of the takt_response_decisions row
        taktRequestId:
          type: string
        responseId:
          type: string
          description: FK to the takt_responses row this decision refers to
        decisionType:
          type: string
          enum:
            - CONFIRM_ACCEPTED
            - ACCEPT_ALTERNATIVE
            - REQUEST_REVISION
            - CLOSE_WITHOUT_AGREEMENT
        acceptedAlternativeId:
          type: string
          nullable: true
          description: >
            Set only for ACCEPT_ALTERNATIVE. References the takt_response_alternatives row.
        comment:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedRequestStatus:
          type: string
          enum:
            - DRAFT
            - SENT
            - DELIVERED
            - DETAILS_RETRIEVED
            - UNDER_REVIEW
            - ACCEPTED
            - ALTERNATIVES_PROPOSED
            - REJECTED
            - REVISION_REQUIRED
            - CANCELLED
            - EXPIRED
            - SUPERSEDED
          description: The TaktRequest status after this decision was applied.
        idempotent:
          type: boolean
          description: true when this was an idempotent retry returning an existing decision.
      required:
        - decisionId
        - taktRequestId
        - responseId
        - decisionType
        - decidedAt
        - createdAt
        - updatedRequestStatus
        - idempotent

    TaktRequestDetail:
      type: object
      description: >
        Full detail record for a single TaktRequest, GU-scoped.
        Includes enriched metadata, timeline, transport, snapshot, and response.
      properties:
        id:
          type: string
        requestNumber:
          type: string
        taktId:
          type: string
        taktBezeichnung:
          type: string
        taktVersion:
          type: integer
        projectId:
          type: string
        projectName:
          type: string
        guOrgId:
          type: string
        nuOrgId:
          type: string
        nuOrgName:
          type: string
        status:
          $ref: "#/components/schemas/TaktRequestStatus"
        responseRequiredBy:
          type: string
          format: date-time
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        detailsRetrievedAt:
          type: string
          format: date-time
          nullable: true
        supersedesRequestId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        transport:
          $ref: "#/components/schemas/TaktRequestDetailTransport"
        snapshot:
          nullable: true
          allOf:
            - type: object
              properties:
                id:
                  type: string
                schemaVersion:
                  type: string
                snapshotPayload:
                  type: object
                  additionalProperties: true
                createdAt:
                  type: string
                  format: date-time
              required:
                - id
                - schemaVersion
                - snapshotPayload
                - createdAt
        response:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TaktRequestDetailResponse"
        timeline:
          $ref: "#/components/schemas/TaktRequestDetailTimeline"
        taktLifecycleStatus:
          type: string
          enum:
            - DRAFT
            - PLANNED
            - IN_COORDINATION
            - CONFIRMED
            - CANCELLED
          nullable: true
          description: Current lifecycle status of the referenced Takt. Null only for legacy rows.
        guDecision:
          nullable: true
          description: Existing GU decision on the NU response for this request, if one has been recorded.
          allOf:
            - $ref: "#/components/schemas/GuDecisionResponse"
      required:
        - id
        - requestNumber
        - taktId
        - taktBezeichnung
        - taktVersion
        - projectId
        - projectName
        - guOrgId
        - nuOrgId
        - nuOrgName
        - status
        - taktLifecycleStatus
        - createdAt
        - updatedAt
        - transport
        - timeline

    # ── Sprint 4 schemas (Task 4.7 / 4.8) ──────────────────────────────────────

    AvailabilityCheckResult:
      type: string
      description: "Overall result of an availability check"
      enum:
        - FEASIBLE
        - FEASIBLE_WITH_ALTERNATIVES
        - NOT_FEASIBLE

    AvailabilityCheckAlternative:
      type: object
      description: "A public alternative time window generated by the availability check"
      properties:
        alternativeId:
          type: string
          description: "Unique ID for this alternative within the check result"
        rank:
          type: integer
          minimum: 1
          description: "Preference rank — 1 is most preferred"
        timeWindow:
          type: object
          description: "Proposed alternative window (date-only strings YYYY-MM-DD)"
          properties:
            start:
              type: string
            end:
              type: string
          required: [start, end]
        crewSize:
          type: integer
          minimum: 1
          nullable: true
        conditions:
          type: array
          items:
            type: string
          nullable: true
      required: [alternativeId, rank, timeWindow]

    AvailabilityCheckPublicResult:
      type: object
      description: >
        Public-facing check result — no NU-internal resource IDs, employee names,
        or internal conflict details.
      properties:
        result:
          $ref: "#/components/schemas/AvailabilityCheckResult"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityCheckAlternative"
          description: "Empty when result is FEASIBLE"
        nextAvailableDate:
          type: string
          format: date
          nullable: true
      required: [result, alternatives]

    AvailabilityCheckResponse:
      type: object
      description: "Availability check row returned by the API (Task 4.7)"
      properties:
        id:
          type: string
        taktRequestId:
          type: string
        nuOrgId:
          type: string
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        result:
          $ref: "#/components/schemas/AvailabilityCheckResult"
        internalResult:
          type: object
          nullable: true
          description: "NU-only internal result payload (not forwarded to GU)"
          additionalProperties: true
        publicResult:
          $ref: "#/components/schemas/AvailabilityCheckPublicResult"
        checkedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, taktRequestId, nuOrgId, status, createdAt]

    NuResponseAlternative:
      type: object
      description: "A ranked alternative time window submitted by the NU"
      properties:
        alternativeId:
          type: string
          minLength: 1
        rank:
          type: integer
          minimum: 1
        timeWindow:
          type: object
          description: "Start and end accept ISO date (YYYY-MM-DD) or datetime strings"
          properties:
            start:
              type: string
              minLength: 1
            end:
              type: string
              minLength: 1
          required: [start, end]
        crewSize:
          type: integer
          minimum: 1
          nullable: true
        conditions:
          type: array
          items:
            type: string
          nullable: true
      required: [alternativeId, rank, timeWindow]

    NuResponseCreate:
      type: object
      description: >
        Body for POST /takt-requests/{requestId}/responses.
        Only generic, public fields are permitted — forbidden fields (resourceId,
        localProjectId, internalResultPayload, etc.) return 400.
      properties:
        decision:
          $ref: "#/components/schemas/TaktDecision"
        acceptedTimeWindow:
          type: object
          description: "Required when decision is ACCEPTED"
          properties:
            start:
              type: string
              minLength: 1
            end:
              type: string
              minLength: 1
          required: [start, end]
        reasonCode:
          $ref: "#/components/schemas/TaktResponseReasonCode"
        comment:
          type: string
          maxLength: 2000
          nullable: true
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/NuResponseAlternative"
          maxItems: 3
          nullable: true
        nextAvailableDate:
          type: string
          format: date
          nullable: true
      required: [decision]

    NuResponseResult:
      type: object
      description: "Result returned by POST /takt-requests/{requestId}/responses"
      properties:
        responseId:
          type: string
        taktRequestId:
          type: string
        decision:
          $ref: "#/components/schemas/TaktDecision"
        reasonCode:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TaktResponseReasonCode"
        comment:
          type: string
          nullable: true
        acceptedTimeWindow:
          type: object
          nullable: true
          properties:
            start:
              type: string
            end:
              type: string
        alternatives:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/NuResponseAlternative"
        nextAvailableDate:
          type: string
          format: date
          nullable: true
        transportStatus:
          type: string
        transportMessageId:
          type: string
        requestStatus:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [responseId, taktRequestId, decision, requestStatus, createdAt]

    TaktResponseReasonCode:
      type: string
      description: >
        Generic reason code for a non-acceptance. Only generic codes may be
        transmitted — internal conflict details must not leave the NU.
      enum:
        - RESOURCE_CONFLICT
        - NO_CAPACITY
        - EQUIPMENT_UNAVAILABLE
        - QUALIFICATION_MISSING
        - TIME_WINDOW_TOO_SHORT
        - OUTSIDE_PLANNING_HORIZON
        - OTHER

    TimeWindow:
      type: object
      description: >
        A time window defined by start and end (both date-time).
        end must be strictly after start.
      properties:
        start:
          type: string
          format: date-time
          description: "ISO 8601 UTC start of the window"
        end:
          type: string
          format: date-time
          description: "ISO 8601 UTC end of the window — must be after start"
      required:
        - start
        - end

    TaktResponseAlternative:
      type: object
      description: "A ranked alternative time window proposed by the NU"
      properties:
        alternativeId:
          type: string
          description: "Unique identifier of this alternative within the response"
        rank:
          type: integer
          minimum: 1
          description: "Preference rank — 1 is most preferred"
        timeWindow:
          $ref: "#/components/schemas/TimeWindow"
        crewSize:
          type: integer
          minimum: 1
          nullable: true
          description: "Number of workers available in this window"
        conditions:
          type: array
          items:
            type: string
          nullable: true
          description: "Generic conditions or constraints for this alternative"
      required:
        - alternativeId
        - rank
        - timeWindow

    TaktResponsePayload:
      type: object
      description: >
        Payload for a TAKT_RESPONSE_SUBMITTED message.
        Only generic reason codes and time windows are transmitted.
        Internal NU resource data must never appear here.
        Business rules (not enforced as runtime validation in this PoC):
          - ACCEPTED: acceptedTimeWindow is required.
          - ALTERNATIVES_PROPOSED: at least one alternative is required.
          - REJECTED: no alternatives are required.
      properties:
        taktRequestId:
          type: string
          description: "References the TaktRequest being responded to"
        decision:
          $ref: "#/components/schemas/TaktDecision"
        reasonCode:
          $ref: "#/components/schemas/TaktResponseReasonCode"
        comment:
          type: string
          maxLength: 2000
          nullable: true
          description: "Optional generic comment — must not contain internal NU details"
        acceptedTimeWindow:
          $ref: "#/components/schemas/TimeWindow"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/TaktResponseAlternative"
          maxItems: 3
          nullable: true
          description: "Up to three ranked alternative time windows"
        nextAvailableDate:
          type: string
          format: date
          nullable: true
          description: "Earliest date the NU could be available — no reason given"
      required:
        - taktRequestId
        - decision

    # ── Specific message types (Task 1.5) ──
    # Defined as explicit flat objects (not allOf) for reliable Orval code generation.

    TaktRequestNotificationMessage:
      type: object
      description: >
        A MessageEnvelope carrying a TaktRequestNotificationPayload.
        messageType is fixed to TAKT_REQUEST_NOTIFICATION.
      properties:
        messageId:
          type: string
          minLength: 1
        schemaVersion:
          type: string
          pattern: '^\d+\.\d+$'
        messageType:
          type: string
          enum: [TAKT_REQUEST_NOTIFICATION]
        senderOrgId:
          type: string
        recipientOrgId:
          type: string
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/TaktRequestNotificationPayload"
        causationId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: "#/components/schemas/DataspaceMessageStatus"
      required:
        - messageId
        - schemaVersion
        - messageType
        - senderOrgId
        - recipientOrgId
        - correlationId
        - createdAt
        - payload

    TaktResponseMessage:
      type: object
      description: >
        A MessageEnvelope carrying a TaktResponsePayload.
        messageType is fixed to TAKT_RESPONSE_SUBMITTED.
      properties:
        messageId:
          type: string
          minLength: 1
        schemaVersion:
          type: string
          pattern: '^\d+\.\d+$'
        messageType:
          type: string
          enum: [TAKT_RESPONSE_SUBMITTED]
        senderOrgId:
          type: string
        recipientOrgId:
          type: string
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/TaktResponsePayload"
        causationId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: "#/components/schemas/DataspaceMessageStatus"
      required:
        - messageId
        - schemaVersion
        - messageType
        - senderOrgId
        - recipientOrgId
        - correlationId
        - createdAt
        - payload

    # ── NU-internal schemas ──────────────────────────────────────────────────────

